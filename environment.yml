# Conda environment for the SKINET pipeline (compute side).
# The `skinet` CLI itself needs only the Python standard library; this env is
# for the cluster job that runs inference/refinement.
#
#   conda env create -f environment.yml
#   conda activate skinet
#
# NOTE: detectron2 and SAM-Med2D's segment_anything are installed from source
# (not on PyPI/conda); see docs/installation.md. CUDA 11.8 toolchain assumed.
name: skinet
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy
  - pandas
  - opencv
  - pycocotools
  - matplotlib
  - pillow
  - scipy
  - pytorch
  - torchvision
  - pytorch-cuda=11.8
  - pip:
      - timm
      # detectron2: install from source matching your torch/CUDA
      # segment_anything: vendored from the SAM-Med2D repo
      # See docs/installation.md for exact commands.
