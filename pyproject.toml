[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skinet-pipeline"
version = "0.1.0"
description = "CLI launcher for the SKINET kidney-biopsy WSI segmentation pipeline (submits to the CCuB SGE cluster)."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Muhammad Haekal Khowarizmi" }]
# No heavy deps here on purpose: the CLI only orchestrates qsub and uses the
# Python standard library. PyTorch / detectron2 / SAM-Med2D live in the cluster
# conda env that the submitted job activates, NOT where you pip-install this.
dependencies = []

[project.scripts]
skinet = "skinet.cli:main"

[tool.setuptools]
packages = ["skinet"]

[tool.setuptools.package-data]
skinet = ["jobs/*.sh", "skinet.env.example", "scripts/*.py", "scripts/*.txt", "scripts/VENDORED"]
